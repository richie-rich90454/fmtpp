<!DOCTYPE html>
<html lang="en">
<head><title>Braces</title></head>
<body>
  <!-- comment with { braces } inside -->
  <div class="app">
    <p>text { with } braces</p>
  </div>
  <script>
    const s = "{ not a block }";
    // line comment with } brace
    if (s) {
      show(s);
    }
  </script>
  <style>
    /* css comment with { } inside */
    .app { color: red; }
  </style>
</body>
</html>
