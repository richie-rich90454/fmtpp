<!DOCTYPE html>
<!-- control demo page -->
<html lang="en">
<head>
  <title>Lists</title>
</head>
<body>
  <div id="main">
    <ul>
      <li>one</li>
      <li>two</li>
    </ul>
    <table>
      <tr><th>a</th></tr>
      <tr><td>1</td></tr>
    </table>
  </div>
  <script>
    const xs = [1, 2];
    for (const x of xs) {
      if (x > 0) {
        show(x);
      }
    }
  </script>
</body>
</html>
